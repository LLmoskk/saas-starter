name: Deploy service

on:
  workflow_call:
    inputs:
      target:
        type: string
        required: true

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      RELEASE_TARGET: ${{ inputs.target }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CF_SEND_TELEMETRY: "false"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
      - name: Prepare production configuration
        env:
          PRODUCTION_ENV_FILE: ${{ secrets.PRODUCTION_ENV_FILE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          if (!['web', 'admin'].includes(process.env.RELEASE_TARGET)) throw new Error('Invalid release target');
          for (const name of ['CLOUDFLARE_ACCOUNT_ID', 'CLOUDFLARE_API_TOKEN', 'PRODUCTION_ENV_FILE']) {
            if (!process.env[name]) throw new Error(`Configure production ${name} before deploying`);
          }
          writeFileSync('apps/web/env.prod', process.env.PRODUCTION_ENV_FILE, { mode: 0o600 });
          NODE
      - run: pnpm install --frozen-lockfile
      - name: Check release commit is still current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)" = "$GITHUB_SHA" || { echo 'Superseded by a newer main commit'; exit 1; }
      - name: Build and deploy service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/cloudflare.mjs deploy prod "$RELEASE_TARGET"
      - name: Remove temporary production configuration
        if: always()
        run: node --input-type=module -e "import {rmSync} from 'node:fs'; rmSync('apps/web/env.prod', {force:true})"
      - name: Record release result
        if: always()
        env:
          RELEASE_STATUS: ${{ job.status }}
        run: |
          {
            echo "## Production release: $RELEASE_TARGET"
            echo "Commit: $GITHUB_SHA"
            echo "Result: $RELEASE_STATUS"
            echo 'Worker versions are recorded in the deployment log.'
          } >> "$GITHUB_STEP_SUMMARY"
