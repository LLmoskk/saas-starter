name: Check

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CF_SEND_TELEMETRY: "false"
      # PRs, including forks, build without production configuration or credentials.
      GOOGLE_ENABLED: "false"
      TURNSTILE_ENABLED: "false"
      PAYMENTS_ENABLED: "false"
      STORAGE_ENABLED: "false"
      EMAIL_ENABLED: "false"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - uses: actions/cache@v5
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-${{ runner.arch }}-turbo-ci-${{ hashFiles('.bun-version', 'pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-turbo-ci-${{ hashFiles('.bun-version', 'pnpm-lock.yaml') }}-

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # Build generates route trees, Paraglide declarations and Worker types.
      - name: Build web and admin without deploying
        run: pnpm exec turbo run build:ci
      - run: pnpm check-types
